```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Employee Login</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f4f7;
      }

      .login-container {
        width: 380px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
      }

      input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #007bff;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #999;
        cursor: not-allowed;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
      }

      .error {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Employee Login</h2>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <button type="submit" id="loginButton">Login</button>

        <div id="message"></div>
      </form>
    </div>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault();

          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          const emp = {
            email: email,
            password: password,
          };

          const loginButton = document.getElementById("loginButton");

          const message = document.getElementById("message");

          loginButton.disabled = true;
          loginButton.innerText = "Logging in...";

          message.innerText = "";
          message.className = "";

          fetch("https://peoject-spring-1.onrender.com/login", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify(emp),
          })
            .then(function (response) {
              if (!response.ok) {
                throw new Error("Server returned " + response.status);
              }

              return response.text();
            })

            .then(function (data) {
              console.log(data);

              if (data !== "not success") {
                // Store email for profile page
                localStorage.setItem("email", emp.email);

                // Go to profile page
                window.location.href = "profile.html";
              } else {
                message.innerText = "Invalid email or password";

                message.className = "error";
              }
            })

            .catch(function (error) {
              console.error(error);

              message.innerText = "Unable to connect to server";

              message.className = "error";
            })

            .finally(function () {
              loginButton.disabled = false;
              loginButton.innerText = "Login";
            });
        });
    </script>
  </body>
</html>
