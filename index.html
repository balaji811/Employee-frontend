```html
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Create Employee</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f4f7;
      }

      .container {
        width: 400px;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 6px;
        font-weight: bold;
        color: #444;
      }

      input {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 15px;
      }

      input:focus {
        outline: none;
        border-color: #007bff;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      button:disabled {
        background: #999;
        cursor: not-allowed;
      }

      #message {
        margin-top: 15px;
        text-align: center;
        font-weight: bold;
      }

      .success {
        color: green;
      }

      .error {
        color: red;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Create Employee</h2>

      <form id="employeeForm">
        <div class="form-group">
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter email"
            required
          />
        </div>

        <div class="form-group">
          <label for="dept">Department</label>
          <input
            type="text"
            id="dept"
            name="dept"
            placeholder="Enter department"
            required
          />
        </div>

        <div class="form-group">
          <label for="salary">Salary</label>
          <input
            type="number"
            id="salary"
            name="salary"
            placeholder="Enter salary"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
          />
        </div>

        <button type="submit" id="submitButton">Create Employee</button>

        <div id="message"></div>
      </form>
    </div>

    <script>
      const form = document.getElementById("employeeForm");
      const message = document.getElementById("message");
      const submitButton = document.getElementById("submitButton");

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const employee = {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          dept: document.getElementById("dept").value,
          salary: Number(document.getElementById("salary").value),
          password: document.getElementById("password").value,
        };

        submitButton.disabled = true;
        submitButton.innerText = "Creating...";

        message.innerText = "";
        message.className = "";

        fetch("https://peoject-spring-1.onrender.com/create", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify(employee),
        })
          .then(function (response) {
            if (!response.ok) {
              throw new Error("Server returned " + response.status);
            }

            return response.json();
          })

          .then(function (data) {
            console.log(data);

            message.innerText = "Employee created successfully!";
            message.className = "success";

            form.reset();
          })

          .catch(function (error) {
            console.error(error);

            message.innerText = "Failed to create employee. Please try again.";

            message.className = "error";
          })

          .finally(function () {
            submitButton.disabled = false;
            submitButton.innerText = "Create Employee";
          });
      });
    </script>
  </body>
</html>
